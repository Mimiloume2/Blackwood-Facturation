<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facture Blackwood</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f6f1eb;
      color: #2e2e2e;
    }
    header {
      background-color: #a97c50;
      color: white;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header img {
      height: 70px;
    }
    main {
      max-width: 850px;
      background: white;
      margin: 2rem auto;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border: 2px solid #a97c50;
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #5c4327;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
      color: #5c4327;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    input[type="checkbox"] {
      transform: scale(1.5);
      margin-right: 8px;
      width: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    th, td {
      border: 1px solid #a97c50;
      padding: 12px;
      text-align: center;
      font-size: 0.95rem;
    }
    thead {
      background-color: #e7d4bf;
    }
    .total-line {
      text-align: right;
      margin-top: 1rem;
      font-weight: bold;
      color: #5c4327;
    }
    button {
      background-color: #a97c50;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1.5rem;
      margin-right: 1rem;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #845c38;
    }
  </style>
  <script>
    'use strict';

    function updateTotal() {
      const rows = document.querySelectorAll("#table-body tr");
      let subtotal = 0;

      rows.forEach(row => {
        const pu = parseFloat(row.querySelector(".unit-price").textContent) || 0;
        // On force la quantité à être >= 0 et nombre
        let qty = parseFloat(row.querySelector("input").value);
        if (isNaN(qty) || qty < 0) qty = 0;
        const total = pu * qty;
        row.querySelector(".line-total").textContent = total.toFixed(2);
        subtotal += total;
      });

      const reductionType = document.getElementById("reduction-type").value;
      let reductionValue = parseFloat(document.getElementById("reduction").value);
      if (isNaN(reductionValue) || reductionValue < 0) reductionValue = 0;
      const reduction = reductionType === "pourcentage" ? subtotal * reductionValue / 100 : reductionValue;
      const base = subtotal - reduction;

      let tauxTva = parseFloat(document.getElementById("taux-tva").value);
      if (isNaN(tauxTva) || tauxTva < 0) tauxTva = 0;
      const tva = base * tauxTva / 100;
      const total = base + tva;

      document.getElementById("subtotal").textContent = subtotal.toFixed(2);
      document.getElementById("tva").textContent = tva.toFixed(2);
      document.getElementById("tva-rate-display").textContent = tauxTva;
      document.getElementById("total").textContent = total.toFixed(2);
    }

    async function generatePDF() {
      try {
        updateTotal();
        const { jsPDF } = window.jspdf;
        if (!jsPDF) {
          alert("jsPDF n'est pas encore chargé. Veuillez réessayer dans un instant.");
          return;
        }

        const doc = new jsPDF();

        // Bandeau entête
        doc.setFillColor(169, 124, 80);
        doc.rect(0, 0, 210, 20, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text("Blackwood Saloon - Facture", 105, 12, { align: "center" });

        doc.setTextColor(0);
        doc.setFontSize(11);
        const client = document.getElementById("client").value;
        const date = document.getElementById("date").value;
        const facture = document.getElementById("facture").value;
        const compte = document.getElementById("compte").value;
        const iban = document.getElementById("iban").value;
        const remarques = document.getElementById("remarques").value;
        const paye = document.getElementById("paye").checked;

        let y = 30;
        doc.text(`Client : ${client}`, 15, y);
        doc.text(`Date : ${date}`, 150, y);
        y += 7;
        doc.text(`Facture n° : ${facture}`, 15, y);
        y += 10;

        // Tableau produits
        doc.setFillColor(231, 212, 191);
        doc.rect(15, y, 180, 8, 'F');
        doc.setFont(undefined, 'bold');
        doc.text("Produit", 20, y + 6);
        doc.text("PU", 100, y + 6);
        doc.text("Qté", 130, y + 6);
        doc.text("Total", 160, y + 6);
        y += 12;
        doc.setFont(undefined, 'normal');

        const rows = document.querySelectorAll("#table-body tr");
        rows.forEach(row => {
          const produit = row.cells[0].textContent;
          const pu = row.cells[1].textContent;
          const qty = row.querySelector("input").value;
          const total = row.cells[3].textContent;
          if (parseFloat(qty) > 0) {
            doc.text(produit, 20, y);
            doc.text(pu + " $", 100, y);
            doc.text(qty, 130, y);
            doc.text(total + " $", 160, y);
            y += 8;
            // Pagination basique si besoin
            if (y > 270) {
              doc.addPage();
              y = 20;
            }
          }
        });

        y += 10;
        doc.setFont(undefined, 'bold');
        doc.text(`Sous-total : ${document.getElementById("subtotal").textContent} $`, 150, y);
        y += 6;
        doc.text(`TVA (${document.getElementById("tva-rate-display").textContent}%) : ${document.getElementById("tva").textContent} $`, 150, y);
        y += 6;
        doc.text(`Total TTC : ${document.getElementById("total").textContent} $`, 150, y);
        y += 10;

        if (remarques) {
          doc.setFont(undefined, 'normal');
          doc.text("Remarques :", 15, y);
          y += 6;
          // Découper les remarques longues pour éviter les dépassements
          const lines = doc.splitTextToSize(remarques, 170);
          doc.text(lines, 15, y);
          y += lines.length * 6 + 4;
        }

        if (paye) {
          doc.setTextColor(0, 153, 0);
          doc.text("FACTURE PAYÉE ✅", 15, y);
          doc.setTextColor(0);
          y += 10;
        }

        doc.setFontSize(10);
        doc.text("Coordonnées bancaires :", 15, y);
        y += 5;
        doc.text(`Compte : ${compte}`, 15, y);
        y += 5;
        doc.text(`Numéro : ${iban}`, 15, y);

        doc.save("facture_blackwood.pdf");
      } catch (error) {
        console.error("Erreur PDF :", error);
        alert("Échec de génération : " + error.message);
      }
    }

    function resetForm() {
      document.getElementById("client").value = "";
      document.getElementById("date").value = "";
      document.getElementById("facture").value = "";
      document.getElementById("remarques").value = "";
      document.getElementById("paye").checked = false;
      document.getElementById("reduction").value = 0;
      document.getElementById("taux-tva").value = 20;
      document.getElementById("reduction-type").value = "montant";
      document.querySelectorAll("#table-body input").forEach(input => input.value = "");
      updateTotal();
    }

    // Mise à jour initiale au chargement
    window.addEventListener('DOMContentLoaded', updateTotal);
  </script>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo Blackwood">
    <div>
      <strong>Blackwood Saloon</strong><br>
      Facturation
    </div>
  </header>
  <main>
    <h1>Générateur de Facture</h1>

    <label for="client">Nom du client :</label>
    <input type="text" id="client" placeholder="Nom du client">

    <label for="date">Date :</label>
    <input type="date" id="date">

    <label for="facture">Numéro de facture :</label>
    <input type="text" id="facture" placeholder="N° facture">

    <label for="compte">Nom du compte :</label>
    <input type="text" id="compte" value="Blackwood Saloon">

    <label for="iban">Numéro de compte :</label>
    <input type="text" id="iban" value="20075">

    <label for="remarques">Remarques :</label>
    <textarea id="remarques" rows="3"></textarea>

    <label><input type="checkbox" id="paye"> Facture payée</label>

    <table>
      <thead>
        <tr>
          <th>Produit</th>
          <th>PU ($)</th>
          <th>Quantité</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td>Cactus cooler (Verre)</td>
          <td class="unit-price">80</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Cookie Crush</td>
          <td class="unit-price">100</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Bière FC</td>
          <td class="unit-price">100</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Cactus Sucrée</td>
          <td class="unit-price">100</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Cola FC</td>
          <td class="unit-price">50</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Tea Carson</td>
          <td class="unit-price">50</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
        <tr>
          <td>Breeze</td>
          <td class="unit-price">50</td>
          <td><input type="number" min="0" placeholder="0" oninput="updateTotal()"></td>
          <td class="line-total">0</td>
        </tr>
      </tbody>
    </table>

    <label for="taux-tva">TVA (%) :</label>
    <input type="number" id="taux-tva" value="20" oninput="updateTotal()">

    <div class="total-line">
      Sous-total : <span id="subtotal">0</span> $<br>
      TVA (<span id="tva-rate-display">20</span>%) : <span id="tva">0</span> $<br>
    </div>

    <label for="reduction-type">Type de réduction :</label>
    <select id="reduction-type" onchange="updateTotal()">
      <option value="montant">Montant ($)</option>
      <option value="pourcentage">Pourcentage (%)</option>
    </select>
    <input type="number" id="reduction" value="0" oninput="updateTotal()">

    <div class="total-line">
      Total TTC : <span id="total">0</span> $
    </div>

    <button onclick="generatePDF()">Télécharger en PDF</button>
    <button onclick="resetForm()">Réinitialiser</button>
  </main>
</body>
</html>
